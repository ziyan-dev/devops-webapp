name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Files
        run: |
          echo "Checking project files..."
          ls -la

      - name: Validate HTML
        run: |
          test -f index.html
          echo "index.html exists successfully"

      - name: Build Completed
        run: |
          echo "Build completed successfully!"
      - name: Slack Success Notification
        if: success()
        run: |
          curl -X POST \
          -H 'Content-type: application/json' \
          --data '{"text":"CI Pipeline succeeded for devops-webapp"}' \
          "${{ secrets.SLACK_WEBHOOK_URL }}"

      - name: Slack Failure Notification
        if: failure()
        run: |
          curl -X POST \
          -H 'Content-type: application/json' \
          --data '{"text":"CI Pipeline failed for devops-webapp"}' \
          "${{ secrets.SLACK_WEBHOOK_URL }}"
