name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Files
        run: |
          echo "Checking project files..."
          ls -la

      - name: Validate HTML
        run: |
          test -f index.html
          echo "index.html exists successfully"

      - name: Build Completed
        run: |
          echo "Build completed successfully!"